<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ENJOY CLUB Admin</title><style>*{box-sizing:border-box}body{margin:0;padding:20px;background:#101827;color:white;font-family:Arial}.wrap{max-width:850px;margin:auto}h1,h2{color:#38e8b5}h1{text-align:center}.card{background:#1c293b;padding:20px;border-radius:14px;margin:18px 0}input{width:100%;padding:13px;margin:7px 0;background:#101827;color:white;border:1px solid #526178;border-radius:8px}button{padding:11px 17px;margin:5px;border:0;border-radius:8px;background:#16c79a;font-weight:bold}.del{background:#ed5262;color:white}.hide{display:none}.item{background:#101827;padding:12px;margin:9px 0;border-radius:8px}#msg{color:#ffe08a}</style></head><body><main class="wrap"><h1>ENJOY CLUB ADMIN</h1><p id="msg"></p><section class="card" id="login"><h2>Admin Login</h2><input id="user" placeholder="Admin username"><input id="pass" type="password" placeholder="Admin password"><button onclick="doLogin()">Login</button></section><div id="dash" class="hide"><section class="card"><button onclick="load()">Refresh</button><button class="del" onclick="logout()">Logout</button></section><section class="card"><h2>Game যোগ করো</h2><input id="gn" placeholder="Game name"><input id="gc" placeholder="Category"><button onclick="addGame()">Add Game</button><div id="games"></div></section><section class="card"><h2>YouTube Video যোগ করো</h2><input id="vt" placeholder="Video title"><input id="vu" placeholder="YouTube URL"><button onclick="addVideo()">Add Video</button><div id="videos"></div></section></div></main><script>
let token=localStorage.getItem("enjoy_admin_token")||"";const msg=t=>document.getElementById("msg").textContent=t;
async function doLogin(){try{let r=await fetch("/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:user.value.trim(),password:pass.value})}),d=await r.json();if(!r.ok)throw Error(d.error);token=d.token;localStorage.setItem("enjoy_admin_token",token);pass.value="";show()}catch(e){msg(e.message||"Login failed")}}
function show(){login.classList.add("hide");dash.classList.remove("hide");load()}function logout(){token="";localStorage.removeItem("enjoy_admin_token");dash.classList.add("hide");login.classList.remove("hide");msg("Logged out")}
async function api(url,opt={}){let r=await fetch(url,{...opt,headers:{...(opt.headers||{}),Authorization:"Bearer "+token,...(opt.body?{"Content-Type":"application/json"}:{})}}),d=await r.json().catch(()=>({}));if(r.status===401){logout();throw Error("আবার Login করুন")}if(!r.ok)throw Error(d.error||"Request failed");return d}
function item(container,label,del){let d=document.createElement("div");d.className="item";let s=document.createElement("span");s.textContent=label;let b=document.createElement("button");b.className="del";b.textContent="Delete";b.onclick=del;d.append(s,b);container.append(d)}
async function load(){try{let [g,v]=await Promise.all([fetch("/api/games").then(r=>r.json()),fetch("/api/videos").then(r=>r.json())]);games.replaceChildren();g.forEach(x=>item(games,x.name+" — "+x.category,()=>remove("/api/games/"+x.id)));videos.replaceChildren();v.forEach(x=>item(videos,x.title+" — "+x.url,()=>remove("/api/videos/"+x.id)))}catch(e){msg(e.message)}}
async function addGame(){try{await api("/api/games",{method:"POST",body:JSON.stringify({name:gn.value.trim(),category:gc.value.trim()})});gn.value="";gc.value="";load();msg("Game added")}catch(e){msg(e.message)}}
async function addVideo(){try{await api("/api/videos",{method:"POST",body:JSON.stringify({title:vt.value.trim(),url:vu.value.trim()})});vt.value="";vu.value="";load();msg("Video added")}catch(e){msg(e.message)}}
async function remove(url){if(!confirm("Delete করবেন?"))return;try{await api(url,{method:"DELETE"});load()}catch(e){msg(e.message)}}
if(token)show();
</script></body></html>

<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ENJOY CLUB</title><style>body{margin:0;background:#0c1422;color:white;font-family:Arial}header{text-align:center;padding:30px;background:linear-gradient(135deg,#123b46,#17233d)}h1,h2{color:#4ce2b8}.wrap{max-width:950px;margin:auto;padding:18px}.panel{background:#18263a;border-radius:14px;padding:18px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.tile{padding:16px;background:#0e1a2b;border-radius:10px}a{color:#4ce2b8}</style></head><body><header><h1>ENJOY CLUB</h1><p>Play • Watch • Enjoy</p></header><main class="wrap"><section class="panel"><h2>Games</h2><div id="games">লোড হচ্ছে...</div></section><section class="panel"><h2>YouTube Videos</h2><div id="videos">লোড হচ্ছে...</div></section><p><a href="/admin.html">Admin Panel</a></p></main><script>
async function load(){try{let [g,v]=await Promise.all([fetch("/api/games").then(r=>r.json()),fetch("/api/videos").then(r=>r.json())]);games.replaceChildren();if(!g.length)games.textContent="এখনো কোনো Game নেই";g.forEach(x=>{let d=document.createElement("div");d.className="tile";d.textContent=x.name+" — "+x.category;games.append(d)});videos.replaceChildren();if(!v.length)videos.textContent="এখনো কোনো Video নেই";v.forEach(x=>{let d=document.createElement("div");d.className="tile";let a=document.createElement("a");a.href=x.url;a.target="_blank";a.rel="noopener noreferrer";a.textContent=x.title;d.append(a);videos.append(d)})}catch(e){games.textContent="Server চালু নেই বা ডেটা লোড হয়নি"}}load();
</script></body></html>
